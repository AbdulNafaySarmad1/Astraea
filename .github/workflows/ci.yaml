name: CI
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./cmd/... ./internal/...
      - run: go build ./cmd/... ./internal/...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run api:types
      - run: git diff --exit-code -- web/src/lib/api.generated.ts
      - run: npm run lint
      - run: npm run types
      - run: npm run build
