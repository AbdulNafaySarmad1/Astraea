name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Mention alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Security and safety impact
      description: Does this touch authentication, tenancy, approvals, audit, secrets, or anything that can change real infrastructure? Describe how it stays safe.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself (after the CLA, see CONTRIBUTING.md).
